<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>TSF preview</title>
<style>
  html,body{margin:0;height:100%;background:#16181d;color:#e8e8ea;font:14px/1.4 system-ui,sans-serif}
  #wrap{display:flex;flex-direction:column;align-items:center;height:100%;padding:10px;box-sizing:border-box;gap:8px}
  canvas{height:calc(100% - 70px);aspect-ratio:9/16;background:#000;border-radius:8px}
  #bar{display:flex;gap:10px;align-items:center;width:min(720px,100%)}
  button{background:#2f6fd6;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
  input[type=range]{flex:1} #t{font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
  #err{color:#ff8a80;white-space:pre-wrap;max-width:720px}
</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script>
</head><body><div id="wrap"><canvas id="c"></canvas>
<div id="bar"><button id="play">Play</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="t">0.0 s</span></div><div id="err"></div></div>
<script type="module">
// Live preview in your own browser (uses your graphics card). Space = play/pause, arrows = step.
import { Film } from '../engine/film.js';
const q = new URLSearchParams(location.search), ep = q.get('ep') || 'demo';
const W = +(q.get('w') || 540), H = +(q.get('h') || 960);
document.title = 'TSF preview: ' + ep;
const c = document.getElementById('c'); c.width = W; c.height = H;
let film, audio = null, playing = false, t = 0, t0 = 0, p0 = 0;
try {
  const mod = await import(`../episodes/${ep}/episode.js?v=${Date.now()}`);
  let words = []; try { const r = await fetch(`../episodes/${ep}/words.json`); if (r.ok) words = await r.json(); } catch (e) {}
  film = new Film(c, W, H, mod, words);
  for (const src of [`../out/${ep}/mix.wav`, `../episodes/${ep}/voice.mp3`, `../episodes/${ep}/voice.wav`]) { const r = await fetch(src, { method: 'HEAD' }); if (r.ok) { audio = new Audio(src); break; } }
} catch (e) { document.getElementById('err').textContent = String(e.stack || e); throw e; }
const D = film.duration, seek = document.getElementById('seek'), tl = document.getElementById('t'), btn = document.getElementById('play');
const draw = () => { film.renderFrame(Math.floor(t * 30), 30); seek.value = (t / D) * 1000; tl.textContent = `${t.toFixed(1)} / ${D.toFixed(1)} s`; };
const loop = () => { if (!playing) return; t = audio ? audio.currentTime : p0 + (performance.now() - t0) / 1000; if (t >= D) { t = 0; if (audio) audio.currentTime = 0; p0 = 0; t0 = performance.now(); } draw(); requestAnimationFrame(loop); };
const play = (on) => { playing = on; btn.textContent = on ? 'Pause' : 'Play'; if (on) { p0 = t; t0 = performance.now(); if (audio) { audio.currentTime = t; audio.play(); } requestAnimationFrame(loop); } else if (audio) audio.pause(); };
btn.onclick = () => play(!playing);
seek.oninput = () => { t = (seek.value / 1000) * D; if (audio) audio.currentTime = t; p0 = t; t0 = performance.now(); draw(); };
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); play(!playing); } if (e.code === 'ArrowRight') { t = Math.min(D, t + 1 / 30); draw(); } if (e.code === 'ArrowLeft') { t = Math.max(0, t - 1 / 30); draw(); } });
draw();
</script></body></html>
